<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Helios Air — Retro Mission Poster (démo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Jost:wght@400;500;600&display=swap">
<style>
:root {
  --bg: #1a1412; --cream: #f4ead8; --on-cream: #1a1412; --text: #f4ead8; --muted: #c9b9a0; --accent: #e24b33; --on-accent: #1a1412; --sky: #2779a7;
  --sand: #c4643c; --rust: #9a4a2e; --dusk: #f2a07a; --grain-opacity: 0.18;
  --font-display: 'Big Shoulders Display', 'Oswald', sans-serif; --font-body: 'Jost', 'Futura', system-ui, sans-serif;
  --text-xs: 0.75rem; --text-sm: 0.875rem; --text-base: 1rem; --text-lg: 1.25rem; --text-title: clamp(3.5rem, 9vw, 8.5rem); --text-giant: clamp(5rem, 16vw, 15rem); --tracking-caps: 0.12em;
  --frame: 12px; --edge: 32px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-6: 24px; --space-8: 32px; --space-12: 48px;
  --radius: 0; --ring: 120px; --tilt: -6deg; --ease: cubic-bezier(0.33, 1, 0.68, 1); --dur-fast: 250ms; --dur: 900ms; --dur-scene: 1600ms;
}
* { box-sizing: border-box; }
html { scroll-snap-type: y mandatory; overflow-x: clip; }
body { margin: 0; background: var(--bg); color: var(--text); font: 400 var(--text-base)/1.5 var(--font-body); }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--cream); outline-offset: 4px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.frame { position: fixed; inset: 0; z-index: 50; pointer-events: none; border: var(--frame) solid var(--cream); }
.top { position: fixed; left: calc(var(--frame) + var(--edge)); right: calc(var(--frame) + var(--edge)); top: calc(var(--frame) + 20px); z-index: 40; display: flex; justify-content: space-between; align-items: center; }
.logo { font: 600 1.4rem/1 var(--font-body); letter-spacing: .14em; color: var(--accent); text-decoration: none; }
.burger { width: 44px; height: 44px; background: none; border: 0; display: grid; gap: 5px; align-content: center; justify-items: end; cursor: pointer; }
.burger i { width: 32px; height: 1.5px; background: var(--cream); }

.chapter { position: relative; height: 100vh; height: 100dvh; scroll-snap-align: start; overflow: hidden; }
.layer { position: absolute; inset: -6%; will-change: transform; transition: transform var(--dur-scene) var(--ease); }
.grain::after { content: ""; position: absolute; inset: 0; filter: url(#grain); opacity: var(--grain-opacity); mix-blend-mode: overlay; pointer-events: none; }
/* Chapitre 1 : désert */
.c1 .back { background: linear-gradient(185deg, var(--sky) 0 18%, #6aa0b8 26%, var(--dusk) 40%, var(--sand) 52%, var(--rust) 75%, #6e3320); }
.c1 .back::before { content: ""; position: absolute; inset: 0 0 60%; background: repeating-linear-gradient(-14deg, transparent 0 40px, rgb(244 234 216 / .35) 40px 46px, transparent 46px 90px); }
.c1 .road { position: absolute; left: -10%; right: 30%; bottom: 8%; height: 18%; background: linear-gradient(90deg, var(--cream), rgb(244 234 216 / .3)); transform: skewY(-8deg); opacity: .8; }
.c1 .hero-obj { position: absolute; left: 14%; bottom: 22%; width: 34%; aspect-ratio: 16/7; background: linear-gradient(180deg, #2a2421, #0f0c0b); border-radius: 30% 40% 8% 8% / 60% 60% 10% 10%; box-shadow: 0 30px 40px rgb(0 0 0 / .4); }
.c1 .hero-obj::before, .c1 .hero-obj::after { content: ""; position: absolute; bottom: -14%; width: 16%; aspect-ratio: 1; border-radius: 50%; background: #111; border: 6px solid #6b6b6b; }
.c1 .hero-obj::before { left: 10%; } .c1 .hero-obj::after { right: 12%; }
.title { position: absolute; right: calc(var(--frame) + 6%); top: 14%; margin: 0; text-align: center; transform: rotate(var(--tilt)); }
.title small { display: block; margin-bottom: 4px; font: 500 var(--text-xs) var(--font-body); letter-spacing: var(--tracking-caps); text-transform: uppercase; }
.title span { display: block; overflow: hidden; font: 800 var(--text-title)/0.85 var(--font-display); text-transform: uppercase; text-shadow: 0 2px 20px rgb(26 20 18 / .25); }
.title span b { display: block; font-weight: inherit; transition: transform var(--dur) var(--ease); }
html.js .chapter:not(.is-in) .title span b { transform: translateY(100%); }
.title span:nth-of-type(2) b { transition-delay: 90ms; }
.pitch { position: absolute; right: calc(var(--frame) + var(--edge) + 20px); bottom: calc(var(--frame) + 40px); width: min(280px, 70vw); text-align: right; }
.pitch h3 { margin: 0 0 6px; font: 600 var(--text-lg) var(--font-body); text-transform: uppercase; letter-spacing: .02em; }
.pitch p { margin: 0 0 var(--space-4); font-size: var(--text-sm); }
.btn-cream { display: inline-flex; align-items: center; min-height: 44px; padding: 0 22px; background: var(--cream); color: var(--on-cream); font: 600 var(--text-xs) var(--font-body); letter-spacing: var(--tracking-caps); text-transform: uppercase; text-decoration: none; transition: background var(--dur-fast) var(--ease); }
.btn-cream:hover { background: var(--accent); }
.ring-btn { position: absolute; left: 50%; bottom: calc(var(--frame) - var(--ring) / 2.6); translate: -50% 0; width: var(--ring); aspect-ratio: 1; border-radius: 50%; border: 1.5px dashed currentColor; background: none; color: var(--accent); display: grid; place-items: center; cursor: pointer; font-size: 2rem; transition: rotate var(--dur-fast) var(--ease); z-index: 5; }
.ring-btn:hover { rotate: 20deg; }
/* Chapitre mission */
.c2 .back { background: radial-gradient(circle at 50% 18%, #6f7da0 0 13%, #3d4a6c 17%, transparent 17.5%), radial-gradient(1px 1px at 20% 30%, var(--cream) 50%, transparent), radial-gradient(1px 1px at 70% 20%, var(--cream) 50%, transparent), radial-gradient(1px 1px at 85% 45%, var(--cream) 50%, transparent), linear-gradient(180deg, #0d0b10 0 55%, #3a1e18 62%, var(--sand) 72%, var(--rust)); }
.giant { position: absolute; left: 0; right: 0; top: 30%; margin: 0; text-align: center; font: 900 var(--text-giant)/0.85 var(--font-display); color: var(--accent); text-transform: uppercase; transition: transform var(--dur-scene) var(--ease); }
.c2 .front { inset: auto -6% -6%; height: 58%; }
.silh { position: absolute; bottom: 12%; width: 4.5%; aspect-ratio: 1/3.2; background: #1d1412; border-radius: 40% 40% 10% 10% / 14% 14% 6% 6%; }
.silh::before { content: ""; position: absolute; left: 22%; top: -14%; width: 56%; aspect-ratio: 1; border-radius: 50%; background: inherit; }
.ch-label { position: absolute; left: calc(var(--frame) + var(--edge)); bottom: calc(var(--frame) + 30px); font: 500 var(--text-xs) var(--font-body); letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--muted); }
.chapter.is-in .back { transform: translateY(-2%); } .chapter.is-in .front { transform: translateY(-4%); } .chapter.is-in .giant { transform: translateY(-3%); }
footer { position: relative; scroll-snap-align: end; padding: 80px calc(var(--frame) + var(--edge)); text-align: center; color: var(--muted); font-size: var(--text-sm); }
@media (max-width: 700px) {
  :root { --frame: 8px; --edge: 20px; --ring: 90px; --tilt: -3deg; }
  .title { left: calc(var(--frame) + var(--edge)); right: auto; text-align: left; top: 16%; }
  .title span { font-size: 3.4rem; }
  .pitch { left: calc(var(--frame) + var(--edge)); right: calc(var(--frame) + var(--edge)); width: auto; text-align: left; bottom: 120px; }
  .giant { font-size: 22vw; top: 38%; }
  .c1 .hero-obj { left: 6%; width: 70%; bottom: 34%; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition-duration: 1ms !important; } html { scroll-snap-type: none; } }
</style>
</head>
<body>
<script>document.documentElement.classList.add('js');</script>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter></svg>
<div class="frame" aria-hidden="true"></div>
<header class="top"><a class="logo" href="#">HELI◎S</a><button class="burger" aria-label="Ouvrir le menu"><i></i><i></i><i></i></button></header>

<main>
  <section class="chapter c1" id="c1" aria-labelledby="t1">
    <div class="layer back grain" data-slot="desert"><div class="road"></div></div>
    <div class="layer front"><div class="hero-obj" data-slot="vehicle" role="img" aria-label="Voiture ancienne sur une route du désert (emplacement)"></div></div>
    <h1 class="title" id="t1"><small>Chapitre 1</small><span><b>Du carburant</b></span><span><b>tiré de l'air</b></span></h1>
    <div class="pitch"><h3>Zéro carbone net</h3><p>Nous captons le CO2 de l'air et le transformons en essence et en kérosène.</p><a class="btn-cream" href="#c2">Notre mission</a></div>
    <button class="ring-btn" data-next="#c2" aria-label="Chapitre suivant">↓</button>
  </section>

  <section class="chapter c2" id="c2" aria-labelledby="t2">
    <div class="layer back grain" data-slot="planet"></div>
    <p class="giant" aria-hidden="true">Mission</p>
    <h2 class="sr-only" id="t2">Mission</h2>
    <div class="layer front grain" data-slot="silhouettes" aria-hidden="true">
      <span class="silh" style="left:8%;height:auto"></span><span class="silh" style="left:18%;width:5.5%;bottom:10%"></span><span class="silh" style="left:46%;width:5%"></span><span class="silh" style="left:51%;width:5%;bottom:11%"></span><span class="silh" style="left:78%"></span><span class="silh" style="left:88%;width:5%;bottom:9%"></span>
    </div>
    <span class="ch-label">Chapitre 2 · 2030</span>
    <button class="ring-btn" data-next="#end" aria-label="Section suivante" style="color:var(--cream)">↓</button>
  </section>
</main>
<footer id="end">© Helios Air (fictif) — démo Kōbō · Presse · Carrières · Contact</footer>
<script>
(() => {
  document.querySelectorAll('[data-next]').forEach(b => b.addEventListener('click', () => document.querySelector(b.dataset.next).scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' })));
  const io = new IntersectionObserver(es => es.forEach(e => e.target.classList.toggle('is-in', e.isIntersecting)), { threshold: .5 });
  document.querySelectorAll('.chapter').forEach(c => io.observe(c));
})();
</script>
</body>
</html>
