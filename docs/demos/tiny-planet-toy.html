<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Postillon — Tiny Planet Toy (démo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Silkscreen&family=Nunito:wght@600;800&display=swap">
<style>
:root {
  --bg: #63c5be; --bg-deep: #4fb3ac; --speck: rgb(255 255 255 / 0.35); --paper: #f6f1e4; --text: #173b3a; --muted: #4a5a58;
  --accent: #f4c84a; --accent-edge: #c9952a; --on-accent: #2b2118; --grass: #4c9a5a; --roof: #d0644a; --stone: #b9b5a6; --sky-shadow: rgb(23 59 58 / 0.18);
  --font-display: 'Bungee', 'Rubik Mono One', system-ui, sans-serif; --font-ui: 'Silkscreen', ui-monospace, monospace; --font-body: 'Nunito', system-ui, sans-serif;
  --text-xs: 0.75rem; --text-sm: 0.875rem; --text-base: 1rem; --text-lg: 1.25rem; --text-xl: 2rem; --text-logo: clamp(2.2rem, 7vw, 4.4rem);
  --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-6: 24px; --space-8: 32px; --space-12: 48px;
  --radius-sm: 4px; --radius-md: 10px; --radius-lg: 20px; --tilt: -3deg; --press: 4px; --outline: 2px solid var(--text);
  --ease-bounce: cubic-bezier(0.34, 1.56, 0.64, 1); --ease: cubic-bezier(0.25, 0.8, 0.25, 1); --dur-fast: 150ms; --dur: 350ms; --spin: 60s;
}
* { box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; }
body { margin: 0; overflow: hidden; background: var(--bg); color: var(--text); font: 600 var(--text-base)/1.5 var(--font-body); }
:focus-visible { outline: 3px solid var(--text); outline-offset: 4px; }
.scene { position: relative; height: 100%; display: grid; place-items: center; align-content: center; gap: var(--space-8); }
.specks i { position: absolute; width: 8px; height: 8px; border-radius: 50%; background: var(--speck); animation: drift var(--d, 30s) linear infinite; }
.specks i:nth-child(3n) { width: 0; height: 0; border-radius: 0; background: none; border: 6px solid transparent; border-bottom-color: var(--speck); }
.specks i:nth-child(4n) { width: 22px; height: 22px; opacity: .6; }
.stage { position: relative; display: grid; place-items: center; }
.planet { position: relative; width: min(84vw, 520px); aspect-ratio: 1; touch-action: none; cursor: grab; animation: pop 700ms var(--ease-bounce) both; }
.planet:active { cursor: grabbing; }
.planet canvas { position: absolute; inset: 0; z-index: 1; display: block; }
/* Repli sans WebGL : disque aux couleurs des tokens (à remplacer par une capture du rendu) */
.planet__fallback { position: absolute; inset: 12%; border-radius: 50%; background: radial-gradient(circle at 38% 32%, var(--stone), var(--grass) 70%); box-shadow: 0 0 0 18px var(--bg-deep), inset -20px -30px 0 var(--sky-shadow); transition: opacity var(--dur) var(--ease), transform 900ms var(--ease); }
.planet.is-3d-ready .planet__fallback { opacity: 0; }
.logo { position: absolute; display: grid; grid-template-columns: repeat(3, auto); gap: 2px 6px; margin: 0; font: 400 var(--text-logo)/0.95 var(--font-display); color: var(--paper); -webkit-text-stroke: 2px var(--text); paint-order: stroke; text-shadow: 4px 6px 0 var(--sky-shadow); pointer-events: none; z-index: 2; }
.logo span { display: block; animation: drop 500ms var(--ease-bounce) both; animation-delay: calc(400ms + var(--i) * 60ms); }
.logo span:nth-child(odd) { transform: rotate(1deg) translateY(1px); }
.toy-btn { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 var(--space-8); border: var(--outline); border-radius: var(--radius-sm); background: var(--accent); color: var(--on-accent); font: 400 var(--text-base)/1 var(--font-ui); text-transform: uppercase; cursor: pointer; transform: rotate(var(--tilt)); box-shadow: 0 var(--press) 0 var(--accent-edge); transition: transform var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease); }
.toy-btn:hover { transform: rotate(var(--tilt)) translateY(-2px); box-shadow: 0 calc(var(--press) + 2px) 0 var(--accent-edge); }
.toy-btn:active { transform: rotate(var(--tilt)) translateY(var(--press)); box-shadow: 0 0 0 var(--accent-edge); }
.hud { position: absolute; inset: var(--space-4) var(--space-4) auto; display: flex; justify-content: space-between; pointer-events: none; }
.hud > * { pointer-events: auto; }
.pill { padding: 6px 12px; background: var(--paper); border: var(--outline); border-radius: 999px; font: 400 var(--text-sm) var(--font-ui); }
.round { width: 44px; height: 44px; border-radius: 50%; background: var(--paper); border: var(--outline); font-size: 18px; cursor: pointer; }
.bubble { position: absolute; left: 50%; bottom: var(--space-8); width: min(520px, calc(100% - 32px)); transform: translateX(-50%) scale(.6); opacity: 0; padding: var(--space-6); background: var(--paper); border: var(--outline); border-radius: var(--radius-md); transition: transform var(--dur) var(--ease-bounce), opacity var(--dur) var(--ease); }
.bubble.is-open { transform: translateX(-50%) scale(1); opacity: 1; }
.bubble b { position: absolute; top: -14px; left: 20px; padding: 2px 8px; background: var(--accent); border: var(--outline); font: 400 var(--text-xs) var(--font-ui); text-transform: uppercase; }
.bubble p { margin: 0; }
.hint { position: absolute; bottom: var(--space-4); left: 0; right: 0; text-align: center; font: 400 var(--text-xs) var(--font-ui); color: var(--text); opacity: .7; }
body.is-playing .logo { transform: translateY(-60vh); transition: transform 900ms var(--ease); }
body.is-playing .planet:not(.is-3d-ready) .planet__fallback { transform: scale(1.6); }
body.is-playing #begin { visibility: hidden; }
@keyframes pop { from { scale: .8; opacity: 0; } }
@keyframes drop { from { transform: translateY(-80px); opacity: 0; } }
@keyframes drift { from { transform: translate(0, 0) rotate(0); } to { transform: translate(120px, -80px) rotate(1turn); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition-duration: 1ms !important; } .specks { display: none; } }
</style>
</head>
<body>
<main class="scene">
  <div class="specks" aria-hidden="true">
    <i style="left:8%;top:12%;--d:34s"></i><i style="left:22%;top:70%;--d:26s"></i><i style="left:40%;top:20%;--d:40s"></i><i style="left:63%;top:82%;--d:30s"></i>
    <i style="left:78%;top:30%;--d:24s"></i><i style="left:90%;top:60%;--d:36s"></i><i style="left:12%;top:45%;--d:28s"></i><i style="left:55%;top:8%;--d:32s"></i>
    <i style="left:70%;top:50%;--d:38s"></i><i style="left:33%;top:88%;--d:22s"></i><i style="left:85%;top:12%;--d:30s"></i><i style="left:4%;top:85%;--d:42s"></i>
  </div>
  <div class="hud"><span class="pill">LETTRES 0/12</span><button class="round" aria-label="Couper le son">♪</button></div>
  <div class="stage">
    <div class="planet" data-3d data-slot="planet" aria-hidden="true">
      <div class="planet__fallback"></div>
    </div>
    <h1 class="logo" aria-label="Postillon"><span style="--i:0">P</span><span style="--i:1">O</span><span style="--i:2">S</span><span style="--i:3">T</span><span style="--i:4">I</span><span style="--i:5">L</span><span style="--i:6">L</span><span style="--i:7">O</span><span style="--i:8">N</span></h1>
  </div>
  <button class="toy-btn" id="begin">Commencer</button>
  <div class="bubble" id="bubble" role="dialog" aria-live="polite"><b>Facteur</b><p id="say"></p></div>
  <p class="hint">Glisser pour tourner · toucher pour parler · 3D : Three.js</p>
</main>
<script>
(() => {
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const line = "Bonjour ! Douze lettres attendent d'être livrées sur cette petite planète. Tu m'aides ?";
  const say = document.getElementById('say'), bubble = document.getElementById('bubble');
  document.getElementById('begin').addEventListener('click', () => {
    document.body.classList.add('is-playing'); bubble.classList.add('is-open');
    if (reduce) { say.textContent = line; return; }
    let i = 0; const t = setInterval(() => { say.textContent = line.slice(0, ++i); if (i >= line.length) clearInterval(t); }, 30);
    bubble.addEventListener('click', () => { clearInterval(t); say.textContent = line; }, { once: true });
  });
})();
</script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';

const host = document.querySelector('[data-3d]');
const css = getComputedStyle(document.documentElement);
const tok = (name) => new THREE.Color(css.getPropertyValue(name).trim());   // couleurs lues dans les tokens (hex)
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
} catch (e) { host.classList.add('no-webgl'); throw e; }
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
host.appendChild(renderer.domElement);
renderer.domElement.setAttribute('aria-hidden', 'true');

const C = { grass: tok('--grass'), stone: tok('--stone'), paper: tok('--paper'), roof: tok('--roof'),
  accent: tok('--accent'), edge: tok('--accent-edge'), deep: tok('--bg-deep'), text: tok('--text') };
const leaf = C.grass.clone().lerp(C.text, 0.25);          // vert plus sombre, dérivé des tokens

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 50);
camera.position.set(0, 0, 5.2);

scene.add(new THREE.HemisphereLight(C.paper, C.deep, 1.6));
const sun = new THREE.DirectionalLight(C.paper, 2.2); sun.position.set(-3, 4, 4); scene.add(sun);

// Ombrage cel en 3 paliers
const grad = new THREE.DataTexture(new Uint8Array([90, 170, 255]), 3, 1, THREE.RedFormat);
grad.minFilter = grad.magFilter = THREE.NearestFilter; grad.needsUpdate = true;
const toon = (color) => new THREE.MeshToonMaterial({ color, gradientMap: grad });
const flat = (g) => { const n = g.toNonIndexed(); n.computeVertexNormals(); return n; };   // facettes visibles (le toon n'a pas d'option flatShading)
const M = { grass: toon(C.grass), stone: toon(C.stone), paper: toon(C.paper), roof: toon(C.roof), leaf: toon(leaf), trunk: toon(C.edge), door: toon(C.accent) };

let seed = 11; const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };

const planet = new THREE.Group(); scene.add(planet);

// Halo derrière la planète
const halo = new THREE.Mesh(new THREE.SphereGeometry(1.2, 48, 24), new THREE.MeshBasicMaterial({ color: C.deep, side: THREE.BackSide }));
scene.add(halo);

// Sol bosselé low-poly (déformation fonction de la position : pas de fissure entre faces)
const groundGeo = new THREE.IcosahedronGeometry(1, 3);
const gp = groundGeo.attributes.position, v = new THREE.Vector3();
for (let i = 0; i < gp.count; i++) {
  v.fromBufferAttribute(gp, i);
  const k = 1 + 0.018 * Math.sin(5 * v.x + 1.1) * Math.sin(4 * v.y + 0.3) * Math.sin(6 * v.z + 2.2);
  v.multiplyScalar(k); gp.setXYZ(i, v.x, v.y, v.z);
}
groundGeo.computeVertexNormals();
planet.add(new THREE.Mesh(groundGeo, M.grass));

// Deux chemins qui font le tour
const roads = [new THREE.Vector3(0.25, 1, 0.2).normalize(), new THREE.Vector3(1, -0.3, 0.45).normalize()];
for (const n of roads) {
  const road = new THREE.Mesh(flat(new THREE.TorusGeometry(1.0, 0.045, 4, 96)), M.stone);
  road.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), n);       // l'axe du tore = normale du plan du chemin
  planet.add(road);
}
const onRoad = (p) => roads.some((n) => Math.abs(p.dot(n)) < 0.11);

// Objets posés sur la surface, « haut » = normale
const UP = new THREE.Vector3(0, 1, 0);
function place(obj, dir, lift = 0.99) {
  obj.position.copy(dir).multiplyScalar(lift);
  obj.quaternion.setFromUnitVectors(UP, dir);
  obj.rotateY(rnd() * Math.PI * 2);
  planet.add(obj);
}
const houseBody = new THREE.BoxGeometry(0.13, 0.1, 0.12), houseRoof = flat(new THREE.ConeGeometry(0.115, 0.09, 4)), door = new THREE.BoxGeometry(0.03, 0.05, 0.005);
houseBody.translate(0, 0.05, 0); houseRoof.rotateY(Math.PI / 4); houseRoof.translate(0, 0.145, 0); door.translate(0, 0.025, 0.061);
const house = () => { const g = new THREE.Group(); g.add(new THREE.Mesh(houseBody, M.paper), new THREE.Mesh(houseRoof, M.roof), new THREE.Mesh(door, M.door)); return g; };
const trunk = flat(new THREE.CylinderGeometry(0.012, 0.018, 0.06, 5)); trunk.translate(0, 0.03, 0);
const ball = new THREE.IcosahedronGeometry(0.065, 0); ball.translate(0, 0.1, 0);
const cone = flat(new THREE.ConeGeometry(0.06, 0.16, 6)); cone.translate(0, 0.13, 0);
const tree = (round) => { const g = new THREE.Group(); g.add(new THREE.Mesh(trunk, M.trunk), new THREE.Mesh(round ? ball : cone, M.leaf)); g.scale.setScalar(0.8 + rnd() * 0.5); return g; };
const rockGeo = new THREE.DodecahedronGeometry(0.04, 0);

const COUNT = 90, golden = Math.PI * (3 - Math.sqrt(5));
for (let i = 0; i < COUNT; i++) {                         // points de Fibonacci répartis sur la sphère
  const y = 1 - (i / (COUNT - 1)) * 2, r = Math.sqrt(1 - y * y), th = golden * i;
  const dir = new THREE.Vector3(Math.cos(th) * r, y, Math.sin(th) * r);
  dir.x += (rnd() - 0.5) * 0.08; dir.z += (rnd() - 0.5) * 0.08; dir.normalize();
  if (onRoad(dir)) continue;
  const roll = rnd();
  if (roll < 0.3) place(house(), dir);
  else if (roll < 0.85) place(tree(roll < 0.55), dir);
  else { const m = new THREE.Mesh(rockGeo, M.stone); m.scale.set(1, 0.6, 1); place(m, dir, 1.0); }
}
planet.rotation.set(0.35, -0.6, 0);

function resize() {
  const w = host.clientWidth, h = host.clientHeight;
  renderer.setSize(w, h, false);
  renderer.domElement.style.width = '100%'; renderer.domElement.style.height = '100%';
  camera.aspect = w / h; camera.updateProjectionMatrix();
  if (reduce) render();
}

// Glisser pour tourner (avec inertie)
let dragging = false, lx = 0, ly = 0, vx = 0, vy = 0, idle = 0;
const AX = new THREE.Vector3(0, 1, 0), AY = new THREE.Vector3(1, 0, 0);
function spin(dx, dy) { planet.rotateOnWorldAxis(AX, dx); planet.rotateOnWorldAxis(AY, dy); }
host.addEventListener('pointerdown', (e) => { dragging = true; lx = e.clientX; ly = e.clientY; vx = vy = 0; host.setPointerCapture(e.pointerId); });
host.addEventListener('pointermove', (e) => {
  if (!dragging) return;
  const k = 3 / host.clientWidth, dx = (e.clientX - lx) * k, dy = (e.clientY - ly) * k;
  lx = e.clientX; ly = e.clientY; vx = dx; vy = dy; idle = 0; spin(dx, dy);
  if (reduce) render();
});
const release = () => { dragging = false; if (reduce) vx = vy = 0; };
host.addEventListener('pointerup', release); host.addEventListener('pointercancel', release);

// Zoom caméra au lancement du jeu (pas de scale CSS sur le canvas)
let zoomFrom = 1, zoomTo = 1, zoomT = 1;
document.getElementById('begin').addEventListener('click', () => {
  zoomFrom = camera.zoom; zoomTo = 1.6; zoomT = 0;
  if (reduce) { camera.zoom = zoomTo; zoomT = 1; camera.updateProjectionMatrix(); render(); }
});
const easeOut = (x) => 1 - Math.pow(1 - x, 3);

function render() { renderer.render(scene, camera); }
new ResizeObserver(resize).observe(host); resize();

const clock = new THREE.Clock();
const spinRate = (Math.PI * 2) / (parseFloat(css.getPropertyValue('--spin')) || 60);   // un tour en --spin
function tick() {
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  if (!dragging) {
    spin(vx, vy); vx *= 0.92; vy *= 0.92;
    idle += dt; if (idle > 1.2) planet.rotateOnWorldAxis(AX, spinRate * dt);
  }
  const s = t < 0.7 ? 0.8 + 0.2 * (1 + 2.70158 * Math.pow(t / 0.7 - 1, 3) + 1.70158 * Math.pow(t / 0.7 - 1, 2)) : 1;   // rebond d'apparition
  planet.scale.setScalar(s);
  if (zoomT < 1) { zoomT = Math.min(zoomT + dt / 0.9, 1); camera.zoom = zoomFrom + (zoomTo - zoomFrom) * easeOut(zoomT); camera.updateProjectionMatrix(); }
  render();
  requestAnimationFrame(tick);
}
reduce ? render() : tick();
host.classList.add('is-3d-ready');
</script>
</body>
</html>
